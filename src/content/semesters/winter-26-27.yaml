sessions:
  - date: 2026-10-23
    title: CCC Cloudflight Coding Contest
    start: "10:00"
    end: "12:00"

  - date: 2026-11-04
    title: Prompting is debugging
    summary: When the AI gets it wrong, treat it like a failing test. Shrink the problem, check your assumptions, add the missing context, try again.
    agenda:
      - 15 min demo
      - 45 min hands-on with a set of deliberately broken prompts
      - 30 min swap your tricks
    bring: A laptop with the AI coding tool you use. Any tool is fine.
    level: Everyone. No experience needed.
    host: Benjamin Hartmann

  - date: 2026-12-02
    title: "Agent skills: build one, share one"
    summary: Skills package instructions and scripts that a coding agent loads when it needs them. We write one together, then everyone builds one for a task they repeat often.
    agenda:
      - 20 min what a skill is and when it pays off
      - 50 min build your own
      - 20 min show and swap
    bring: A laptop and an idea for a task you keep explaining to your agent.
    prerequisites: An AI coding agent installed, such as Claude Code, Codex or GitHub Copilot.
    host: Rainer Stropek

  - date: 2026-12-16
    title: Advent of Code with an AI pair
    summary: Solve Advent of Code puzzles with an AI pair and compare strategies.

